[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "hexagonal-mcp-server"
version = "0.1.0"
description = "MCP Server for generating FastAPI CRUD modules with hexagonal architecture"
requires-python = ">=3.10"
dependencies = [
    "mcp>=0.1.0",
    "hexagon-generator @ git+https://github.com/JhonSanz/empty-fastapi-hexagonal.git",
]

[project.scripts]
hexagonal-mcp = "mcp_server.server:main"

[tool.setuptools.packages.find]
include = ["mcp_server*"]
